name: ci

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # ZKNOX ETHDILITHIUM rev vendored at js-client/contracts/lib/ETHDILITHIUM
  # (see js-client/README.md "Vendored verifier"); df999ed
  ETHDILITHIUM_REV: df999ed4f8032d26d9d3d22748407afbb7978ae7

jobs:
  # ---------------------------------------------------------------- python
  python:
    name: python (spec, vectors)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/pyproject.toml
      # bench extra = coincurve, needed by the classical-spend tests (else skipped)
      - run: pip install -e ".[dev,bench]"
      - run: ruff check .
      - run: pytest -q
      # the conformance vectors are deterministic: regenerating them must be
      # byte-identical to the committed vectors/v0/vectors.json
      - name: vectors are reproducible
        run: |
          python vectors/generate_vectors.py --outdir "$RUNNER_TEMP/vec"
          cmp vectors/v0/vectors.json "$RUNNER_TEMP/vec/vectors.json"
          python vectors/generate_classical_vectors.py --outdir "$RUNNER_TEMP/cvec"
          cmp vectors/classical/v0/vectors.json "$RUNNER_TEMP/cvec/vectors.json"

  # liboqs cross-check (audited ML-DSA verifier) — the Dockerfile builds
  # liboqs, so it runs the one test the plain job importorskips
  python-liboqs:
    name: python (liboqs cross-check, docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pq-stealth-py python
      - run: docker run --rm pq-stealth-py pytest -q
      - name: vectors are reproducible (liboqs image)
        run: |
          docker run --rm pq-stealth-py sh -c \
            "cp vectors/v0/vectors.json /tmp/ref.json \
             && python vectors/generate_vectors.py \
             && cmp vectors/v0/vectors.json /tmp/ref.json && echo vectors OK"

  # ------------------------------------------------------------- js-client
  js-client:
    name: js-client (typecheck, conformance, anvil e2e, fork replay)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: js-client
    env:
      # the blinded ML-DSA signer (src/spend.ts) shells out to python
      PQ_PYTHON: python
      # fork tests must REPLAY test/state/*.rpc.json — never touch a live RPC
      # from CI; an unreachable upstream makes any accidental record fail fast
      SEPOLIA_RPC_URL: http://127.0.0.1:1
    steps:
      - uses: actions/checkout@v4
      # vendored verifier + its lib/ deps (openzeppelin, solady, forge-std,
      # account-abstraction) at the pinned rev — ~42 MB, gitignored
      - uses: actions/checkout@v4
        with:
          repository: ZKNoxHQ/ETHDILITHIUM
          ref: ${{ env.ETHDILITHIUM_REV }}
          submodules: recursive
          path: js-client/contracts/lib/ETHDILITHIUM
      # pinned: the recorded fork caches are keyed by anvil's upstream fetch
      # pattern; a different anvil may miss the cache (re-record then)
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.4.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: js-client/.nvmrc
          cache: npm
          cache-dependency-path: js-client/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            python/pyproject.toml
            js-client/contracts/lib/ETHDILITHIUM/pythonref/requirements.txt
      - name: python deps for the blinded signer
        run: |
          pip install -e "../python[dev]"
          pip install -r contracts/lib/ETHDILITHIUM/pythonref/requirements.txt
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # forge build first: the anvil e2e tests read contracts/out/*.json
      - run: npm run build-contracts
      - run: npm run e2e
      - run: npm run e2e-7913
      - run: npm run e2e-7913-classical
      - run: npm run e2e-7913-sphincs
      - run: npm run e2e-pointer-sig
      - run: npm run e2e:fork

  # ------------------------------------------------------------------ noir
  wiki:
    name: wiki (biome, typecheck, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: wiki
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # the action runs at repo root (no package.json there), so pin the
          # version explicitly — matches wiki/package.json's packageManager
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: wiki/.nvmrc
          cache: pnpm
          cache-dependency-path: wiki/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # sync (runs lean/scripts/gen_browser.py, stdlib python3) emits the
      # generated sources typecheck imports (src/generated, src/sidebar.gen) —
      # must run before typecheck, not only in the build prebuild.
      - run: pnpm sync
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
        env:
          WIKI_BASE_PATH: /pq-sap
      - uses: actions/upload-pages-artifact@v3
        with:
          path: wiki/dist/public

  # publish the wiki to GitHub Pages (https://skanislav.github.io/pq-sap/) on
  # every push to main; the artifact comes from the wiki job above
  wiki-pages:
    name: wiki (GitHub Pages)
    needs: wiki
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  noir:
    name: noir (ownership circuit, toy params)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: noir/pq-stealth-ownership
    steps:
      - uses: actions/checkout@v4
      - uses: noir-lang/noirup@v0.1.4
        with:
          toolchain: 1.0.0-beta.19
      - name: install bb
        run: |
          curl -L https://bbup.aztec.network | bash
          "$HOME/.bb/bbup" -v 4.2.0
          echo "$HOME/.bb" >> "$GITHUB_PATH"
      # the full ML-DSA-65 circuit (N=256,K=6,L=5) needs ~15 GB to compile —
      # more than a hosted runner has; CI runs the README's toy config
      - name: toy parameters (N=8, K=2, L=2)
        run: |
          sed -i -e 's/^global N: u32 = 256;/global N: u32 = 8;/' \
                 -e 's/^global K: u32 = 6;/global K: u32 = 2;/' \
                 -e 's/^global L: u32 = 5;/global L: u32 = 2;/' src/main.nr
          grep -n '^global [NKL]:' src/main.nr
          python3 generate_prover.py 8 2 2 8
      - run: nargo execute
      - name: prove + verify (UltraHonk)
        run: |
          bb write_vk -b target/pq_stealth_ownership.json -o target
          bb prove -b target/pq_stealth_ownership.json -w target/pq_stealth_ownership.gz -o target
          bb verify -k target/vk -p target/proof -i target/public_inputs

  # ------------------------------------------------------------------ lean
  # the Lean core builds in its own workflow (.github/workflows/lean.yml):
  # multi-hour cold build with a narrow .lake cache + no-sorry/no-warning audit
