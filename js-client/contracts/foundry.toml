[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 10000
solc_version = "0.8.30"
# Upstream ETHDILITHIUM targets osaka; prague keeps anvil compatibility (D-014).
evm_version = "prague"

# The vendored SPHINCS- C13 verifier (src/vendor/sphincs-minus/) is compiled with
# upstream's settings (via-IR, 200 runs) so its bytecode matches what Verity Labs
# modeled; the default (legacy codegen) profile hits stack-too-deep on it. Only
# that path is affected; ETHDILITHIUM and our own contracts keep the default.
additional_compiler_profiles = [
  { name = "sphincs-minus", via_ir = true, optimizer_runs = 200 },
]
compilation_restrictions = [
  { paths = "src/vendor/sphincs-minus/**", via_ir = true, optimizer_runs = 200 },
]

# NttPrecompute.t.sol reads the python fixture
fs_permissions = [
  { access = "read", path = "../../python/scripts" },
  # ZkAccount.t.sol reads the UltraHonk proof of the C13 circuit
  { access = "read", path = "../../noir/sphincs-c13-verify/out" },
  { access = "read", path = "../../noir/preimage-ownership/out" },
]
